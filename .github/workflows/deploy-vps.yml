# Deploy Echo Move to the demo VPS (isolated project `echo-move`, port 18080).
# Does not modify nginx / aaPanel / other containers.
#
# Repo → Settings → Secrets and variables → Actions → Secrets:
#   VPS_HOST     = 51.222.86.7
#   VPS_USER     = ubuntu
#   VPS_SSH_KEY  = private ed25519 key (see docs/DEPLOY_VPS.md)
# Optional Variables:
#   VPS_APP_DIR  = /home/ubuntu/apps/echo-move
name: Deploy VPS
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - "web/**"
      - "docker/**"
      - ".github/workflows/deploy-vps.yml"
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_SSH_KEY" \
            || { echo "Set secrets VPS_HOST, VPS_USER, VPS_SSH_KEY"; exit 1; }
      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Rsync app (isolated dir only)
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          APP_DIR: ${{ vars.VPS_APP_DIR || '/home/ubuntu/apps/echo-move' }}
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude 'output/' \
            --exclude '.env' \
            --exclude '*.pt' \
            ./ "${VPS_USER}@${VPS_HOST}:${APP_DIR}/"
      - name: Rebuild and restart echo-move only
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          APP_DIR: ${{ vars.VPS_APP_DIR || '/home/ubuntu/apps/echo-move' }}
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" "APP_DIR='${APP_DIR}' bash -s" <<'EOF'
          set -euo pipefail
          cd "$APP_DIR"
          test -f .env || cp .env.example .env
          sudo docker compose -p echo-move -f docker/docker-compose.vps.yml --env-file .env build
          sudo docker compose -p echo-move -f docker/docker-compose.vps.yml --env-file .env up -d
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18080/health && exit 0
            sleep 3
          done
          echo "health check failed"; sudo docker logs echo-move-backend --tail 50; exit 1
          EOF
