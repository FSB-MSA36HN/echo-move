[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-move"
version = "21.0.0"
description = "Worker safety warning system: pose-based posture check + image quality assessment"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "opencv-python-headless>=4.8",
  "numpy>=1.24",
  "pydantic>=2.5",
]

[project.optional-dependencies]
ai = ["ultralytics>=8.1", "mediapipe>=0.10"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
echo-move = "echo_move.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
echo_move = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
ignore_missing_imports = true
