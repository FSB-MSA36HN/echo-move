# Isolated VPS demo stack — does not replace other host services.
# Host port 18080 → container 8000. Project name: echo-move.
services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ECHO_WITH_AI: ${ECHO_WITH_AI:-1}
    image: echo-move-backend:demo
    container_name: echo-move-backend
    ports:
      - "18080:8000"
    restart: unless-stopped
    # Secrets/tunables come from ../.env (do not re-declare with ${VAR:-}
    # here — empty host interpolation would override env_file).
    env_file:
      - ../.env
    environment:
      ECHO_HOST: "0.0.0.0"
      ECHO_PORT: "8000"
      ECHO_CORS_ORIGINS: "*"
    volumes:
      - ../output:/data/output
      # Host web is source of truth (avoids stale UI baked into the image).
      - ../web:/app/web:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
