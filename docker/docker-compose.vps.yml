# Isolated VPS demo stack — does not replace other host services.
# Host port 18080 → container 8000. Project name: echo-move.
services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ECHO_WITH_AI: ${ECHO_WITH_AI:-1}
    image: echo-move-backend:demo
    container_name: echo-move-backend
    ports:
      - "18080:8000"
    restart: unless-stopped
    environment:
      ECHO_HOST: "0.0.0.0"
      ECHO_PORT: "8000"
      ECHO_DEMO_MODE: ${ECHO_DEMO_MODE:-0}
      ECHO_CORS_ORIGINS: "*"
      ECHO_CAMERAS: ${ECHO_CAMERAS:-}
      ECHO_TELEGRAM_TOKEN: ${ECHO_TELEGRAM_TOKEN:-}
      ECHO_TELEGRAM_CHAT_ID: ${ECHO_TELEGRAM_CHAT_ID:-}
      ECHO_WEBHOOK_URL: ${ECHO_WEBHOOK_URL:-}
      ECHO_ESCALATE_TELEGRAM_CHAT_ID: ${ECHO_ESCALATE_TELEGRAM_CHAT_ID:-}
      ECHO_ESCALATE_MIN: ${ECHO_ESCALATE_MIN:-0}
      ECHO_RETENTION_DAYS: ${ECHO_RETENTION_DAYS:-7}
      ECHO_BLUR_FACES: ${ECHO_BLUR_FACES:-1}
      ECHO_EVENT_CLIPS: ${ECHO_EVENT_CLIPS:-1}
    volumes:
      - ../output:/data/output
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
